# nginx config for the TechMinds site (replaces the image's default.conf).
# Pages, CSS and JS: browsers must re-check with the server each time ("no-cache"), so a new
# version shows up immediately. Unchanged files answer 304 Not Modified, so it stays fast.
# Images: kept for a week.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Note: add_header in a location replaces (not adds to) the server-level ones,
    # so each location includes the full set.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

}
